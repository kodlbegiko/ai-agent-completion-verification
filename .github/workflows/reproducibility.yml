name: Reproducibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'tasks/**'
      - 'src/**'
      - 'scripts/**'
      - 'data/**'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: reproducibility-evidence
          path: artifacts/reproducibility-*.json
