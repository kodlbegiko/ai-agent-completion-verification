name: Bootstrap Verified Pilot Source

on:
  push:
    branches:
      - agent/publish-pilot
    paths:
      - .github/workflows/bootstrap.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap.yml
      - bootstrap/**

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-pilot' || github.ref_name == 'agent/publish-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publish-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          check_chunk() {
            local expected="$1"
            local file="$2"
            local actual
            actual="$(tr -d '\r\n' < "$file" | sha256sum | cut -d' ' -f1)"
            test "$actual" = "$expected" || { echo "$file canonical hash mismatch: $actual"; exit 1; }
          }
          check_chunk 4e0cf518cef45f22cba9d2655a21998c490a8d8e4ef924fe7650fac995526e27 bootstrap/source-00.b64
          check_chunk 9f1e711766321204661cc64d2adf0bb4695994d2b0d8c7fd943c7f5ad5ef541d bootstrap/source-01.b64
          check_chunk c3b60ff05d0ec3f03e6806ab6319c454b261d6dfbd57b9ee46372a3335f26d80 bootstrap/source-0200.b64
          check_chunk 573373411adab03dcc5a68b79d0e4f46df8d76e6cd3977f99a77abdbee89d8cc bootstrap/source-0201.b64
          check_chunk e7646d44cd73fb3e140ef183ae0cf47f2bd2f03979353397b063e040148474b3 bootstrap/source-0202.b64
          check_chunk 5cd66490299d1bb3597103261a5834e905237b2ce21863fde8c875f3d059b486 bootstrap/source-0203.b64
          check_chunk bc871a12e4d4627b44111dc139979be5214966d268774165ba9afc6d730165de bootstrap/source-030.b64
          check_chunk 92bc98cff46cf005c89f33efd61b2ef2370ac1e3052eb6901ab9d4238673970b bootstrap/source-031.b64
          check_chunk 8a0a0d4508e4a00f5343a5c03cbc38e5e680858d8fc401730fff3bef65c28964 bootstrap/source-040.b64
          check_chunk b3ab43871df710d41c4e6bb69a777df95ac6d64c21305218d7a6e08c68ffc73f bootstrap/source-041.b64
          check_chunk ae46785b9972a00a3dbd29249d9aa62fdaf25cb945edfe3c0d07187b77194673 bootstrap/source-050.b64
          check_chunk 470f63cdf06a76f08d9b5cc397f3f9a7c65284409d039d5df901b8021c99f4c5 bootstrap/source-051.b64
          cat \
            bootstrap/source-00.b64 \
            bootstrap/source-01.b64 \
            bootstrap/source-0200.b64 \
            bootstrap/source-0201.b64 \
            bootstrap/source-0202.b64 \
            bootstrap/source-0203.b64 \
            bootstrap/source-030.b64 \
            bootstrap/source-031.b64 \
            bootstrap/source-040.b64 \
            bootstrap/source-041.b64 \
            bootstrap/source-050.b64 \
            bootstrap/source-051.b64 \
            | base64 --decode > /tmp/acv-bootstrap-source.zip
          echo "9ec9463e7b71d49003ba97ed307efa4c4c74b27482abcf8fac6b5c10ca182627  /tmp/acv-bootstrap-source.zip" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path.cwd().resolve()
          archive = Path('/tmp/acv-bootstrap-source.zip')
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  target = (root / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
              zf.extractall(root)
          PY

          # A clean Git checkout does not preserve empty directories. Make the
          # analysis command create its own output directories so the same
          # source works locally, in CI, and in independent reproductions.
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/analyze_results.py')
          text = path.read_text(encoding='utf-8')
          needle = '    path = ROOT / args.input\n'
          replacement = (
              needle
              + '    for output_dir in (ROOT / "results" / "tables", ROOT / "results" / "reports"):\n'
              + '        output_dir.mkdir(parents=True, exist_ok=True)\n'
          )
          if needle not in text:
              raise SystemExit('analysis output-directory patch anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Verify pilot and build publication assets
        shell: bash
        run: |
          set -euo pipefail
          make verify
          make release-bundle
          sha256sum -c SHA256SUMS

      - name: Commit verified pilot source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: publish verified synthetic pilot"
          git push origin HEAD:agent/publish-pilot
