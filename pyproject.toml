[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-completion-verification"
version = "0.1.0"
description = "Pilot research infrastructure for evaluating false-completion detection methods."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Liu Chu-Hsiang"}]

[tool.coverage.run]
branch = true
source = ["src/completion_verification"]

[tool.setuptools.packages.find]
where = ["src"]
